<!DOCTYPE html>
<html lang="id">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LJCF3GVDCK"></script>
    <script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Optikit AI Content Studio</title>
    <style>
        :root { 
            --primary: #4f46e5; 
            --primary-light: #38bdf8;
            --primary-glow: #818cf8;
            --bg-gradient: linear-gradient(180deg, #1e1b4b 0%, #090d16 100%); 
            --card-bg: rgba(23, 37, 84, 0.4); 
            --input-bg: rgba(15, 23, 42, 0.65);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg-gradient); 
            background-attachment: fixed; 
            min-height: 100vh;
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            padding: 24px 12px 40px 12px; 
            color: var(--text-main);
            margin: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        .card { 
            width: 100%; 
            max-width: 440px; 
            background: var(--card-bg); 
            padding: 26px 20px; 
            border-radius: 28px; 
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 
                        0 0 50px -10px rgba(99, 102, 241, 0.15); 
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            margin-top: 10px; 
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 18px;
            margin-top: 8px;
        }
        .logo-box { 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #ffffff; 
            width: 84px; 
            height: 84px; 
            border-radius: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35), 
                        0 0 20px rgba(99, 102, 241, 0.15); 
            box-sizing: border-box;
            padding: 14px; 
        }
        .logo-img { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
            display: block; 
        }

        .app-title {
            text-align: center;
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 26px; 
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        label { 
            font-weight: 700; 
            color: #94a3b8; 
            display: block; 
            margin: 18px 0 6px; 
            font-size: 11px; 
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }
        
        textarea, select { 
            width: 100%; 
            padding: 14px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 14px; 
            box-sizing: border-box; 
            font-size: 15px; 
            margin-bottom: 8px; 
            background: var(--input-bg); 
            color: #f1f5f9; 
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
            -webkit-appearance: none; 
            -moz-appearance: none;
            appearance: none; 
        }
        
        select {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
            padding-right: 40px;
        }
        
        textarea:focus, select:focus { 
            border-color: var(--primary-glow); 
            outline: none; 
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.3), inset 0 2px 4px rgba(0, 0, 0, 0.2); 
            background: rgba(15, 23, 42, 0.85);
        }

        .file-upload-wrapper {
            position: relative;
            width: 100%;
            height: 52px;
            background: rgba(15, 23, 42, 0.4);
            border: 2px dashed rgba(99, 102, 241, 0.3);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .file-upload-wrapper input[type="file"] {
            position: absolute;
            left: 0; top: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
            margin: 0;
        }
        .file-upload-text {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 500;
        }

        .image-preview-container {
            display: none;
            width: 100%;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 5px;
            background: rgba(15, 23, 42, 0.3);
            padding: 10px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-sizing: border-box;
        }
        .image-preview-container img {
            max-width: 100%;
            max-height: 180px; 
            border-radius: 10px;
            object-fit: contain;
        }
        
        select option { background: #0f172a; color: #f8fafc; }
        
        button { 
            width: 100%; 
            padding: 15px; 
            border: none; 
            border-radius: 14px; 
            font-weight: 800; 
            font-size: 15px; 
            cursor: pointer; 
            transition: all 0.25s ease; 
            color: white; 
            margin-top: 14px; 
            letter-spacing: 0.5px;
        }
        
        .btn-gen { 
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 50%, #7c3aed 100%); 
            background-size: 200% auto;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4); 
        }
        
        /* === KOTAK HASIL === */
        #result { 
            margin-top: 25px; 
            padding: 20px; 
            background: rgba(10, 15, 30, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.4); 
            border-radius: 18px; 
            display: none; 
            font-size: 14px; 
            line-height: 1.7; 
            color: #cbd5e1;
            box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.08), 0 15px 40px rgba(0,0,0,0.4);
        }

        .main-text-box {
            background: rgba(15, 23, 42, 0.5);
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .script-block {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.9)); 
            border-left: 4px solid #38bdf8;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 14px 16px;
            border-radius: 6px 14px 14px 6px;
            margin: 18px 0;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }

        .time-tag { 
            font-weight: 800; 
            color: #38bdf8; 
            display: block; 
            font-size: 12px; 
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            padding-bottom: 6px;
        }
        
        .platform-box {
            background: rgba(15, 23, 42, 0.7);
            padding: 14px; 
            border-radius: 14px;
            margin-top: 14px;
            border: 1px dashed rgba(99, 102, 241, 0.5);
        }
        .platform-title { font-weight: 700; color: #94a3b8; display: block; margin-bottom: 6px; font-size: 11px; text-transform: uppercase; }
        .hashtag-text { color: #38bdf8; font-weight: 600; font-family: monospace; font-size: 13px; display: block; white-space: pre-wrap; margin-bottom: 12px; }

        .copy-action-row {
            display: flex;
            justify-content: flex-end; 
            width: 100%;
            margin-top: 10px;
        }
        
        .inline-copy-btn {
            width: auto;
            padding: 8px 16px;
            font-size: 11px;
            font-weight: 800;
            border-radius: 10px;
            margin-top: 0;
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="logo-container">
        <div class="logo-box">
            <img src="logo.jpg" alt="Optikit" class="logo-img" id="mainLogo">
        </div>
    </div>

    <div class="app-title">Content Automation Studio</div>
    
    <label>Nama Produk / Deskripsi</label>
    <textarea id="product" rows="3" placeholder="Contoh: Kemeja Oversize Linen, bahan adem..."></textarea>

    <label>Unggah Foto Produk</label>
    <div class="file-upload-wrapper">
        <span class="file-upload-text" id="uploadText">📁 Ketuk untuk pilih foto produk...</span>
        <input type="file" id="imageInput" accept="image/*" onchange="handleFileSelect()">
    </div>

    <div class="image-preview-container" id="previewContainer">
        <img src="" id="imagePreview" alt="Preview Foto Produk">
    </div>

    <label>Jenis Konten & Durasi</label>
    <select id="toolType">
        <option value="caption">✍️ Caption Singkat & Hashtag Affiliate</option>
        <option value="script15">🎬 Skrip Video 15 Detik + Voiceover</option>
        <option value="script30">🎥 Skrip Video 30 Detik + Voiceover</option>
        <option value="hashtag">#️⃣ Kumpulan Hashtag Viral Saja</option>
    </select>

    <label>Pilih Gaya Bahasa</label>
    <select id="tone">
        <option value="santai">😊 Santai & Gaul (Anak Muda)</option>
        <option value="hardsell">🔥 Hard Sell (Urgensi & Diskon)</option>
        <option value="softsell">📖 Soft Sell (Storytelling / Solusi)</option>
        <option value="edukatif">📚 Edukatif (Manfaat & Review Resmi)</option>
        <option value="aesthetic">✨ Aesthetic & Calming</option>
        <option value="lucu">😂 Humoris & Relate</option>
        <option value="penasaran">🤔 Bikin Penasaran / Clickbait</option>
        <option value="racun">🛍️ Racun Affiliate (Influencer Style)</option>
    </select>

    <button id="btn" class="btn-gen" onclick="generate()">Generate Konten</button>
    <div id="result"></div>
</div>

<script>
    function handleFileSelect() {
        const input = document.getElementById('imageInput');
        const text = document.getElementById('uploadText');
        const previewContainer = document.getElementById('previewContainer');
        const imagePreview = document.getElementById('imagePreview');

        if(input.files.length > 0) {
            const file = input.files[0];
            text.innerText = "✅ " + file.name;
            text.style.color = "#38bdf8";

            const reader = new FileReader();
            reader.onload = function(e) {
                imagePreview.src = e.target.result;
                previewContainer.style.display = "block";
            }
            reader.readAsDataURL(file);
        } else {
            text.innerText = "📁 Ketuk untuk pilih foto produk...";
            text.style.color = "#94a3b8";
            previewContainer.style.display = "none";
        }
    }

    function directCopy(textToCopy, buttonId) {
        let cleanText = textToCopy;
        cleanText = cleanText.replace(/\[?Ide Video:[^\]]*\]?\s*/gi, '');
        cleanText = cleanText.replace(/💡 /g, '').replace(/⏱️ /g, '').replace(/👁️ /g, '').replace(/🎙️ /g, '').replace(/📱 /g, '');
        cleanText = cleanText.trim();

        const btn = document.getElementById(buttonId);
        const originalText = btn ? btn.innerText : "Salin";

        function showSuccess() {
            if (btn) {
                btn.innerText = "✅ Tersalin!";
                setTimeout(() => { btn.innerText = originalText; }, 2000);
            }
        }

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(cleanText).then(() => {
                showSuccess();
            }).catch(() => {
                fallbackCopy(cleanText); 
            });
        } else {
            fallbackCopy(cleanText); 
        }

        function fallbackCopy(text) {
            let textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                let successful = document.execCommand('copy');
                if (successful) {
                    showSuccess();
                } else {
                    alert("Browser menolak. Silakan blokir teks dan salin manual.");
                }
            } catch (err) {
                alert("Perangkat Anda tidak mengizinkan salin otomatis.");
            }
            document.body.removeChild(textArea);
        }
    }

    function formatScriptText(rawText) {
        let text = rawText.replace(/\*\*/g, ''); 
        const currentTool = document.getElementById('toolType').value;
        const mainButtonLabel = (currentTool === "caption") ? "📋 Salin Caption" : "📋 Salin Skrip";

        let hashtagSplit = text.split(/(\[TikTok\]|\[Shopee\]|\[Instagram\]|\[TikTok Hashtag\]|\[Shopee Hashtag\]|\[Instagram Hashtag\])/gi);
        let htmlOutput = "";

        if (hashtagSplit.length > 1) {
            let mainTextRaw = hashtagSplit[0].replace(/\*\*/g, '');
            let sections = mainTextRaw.split(/(?=Detik \d+-\d+)/gi);
            let processedMainText = "";

            sections.forEach(section => {
                if (section.trim() === "") return;
                
                let content = section;
                let title = "";

                if (content.match(/^Detik \d+-\d+/i)) {
                    let titleMatch = content.match(/^(Detik \d+-\d+[^\n]*)/i);
                    title = titleMatch ? titleMatch[1] : "";
                    content = content.replace(title, "").trim();
                }

                content = content.replace(/\[?Ide Video:\s*([\s\S]*?)\]?(?=(?:Detik|Visual:|Voiceover:|<div|$))/gi, function(m, p1) {
                    return '<div style="margin-bottom:18px; padding:16px; background:rgba(56, 189, 248, 0.1); border:1px dashed rgba(56, 189, 248, 0.4); border-radius:12px;">' +
                           '<span style="color:#38bdf8; font-weight:800; font-size:11px; letter-spacing:1.5px; text-transform:uppercase;">💡 IDE VIDEO</span><br>' +
                           '<div style="color:#e0f2fe; font-size:13.5px; line-height:1.6; margin-top:6px;">' + p1.trim().replace(/\]$/, '') + '</div>' +
                           '</div>';
                });

                content = content.replace(/\[?Visual:\s*([\s\S]*?)\]?(?=(?:Voiceover:|Audio:|<div|$))/gi, function(m, p1) {
                    return '<div style="margin-top:12px; margin-bottom:12px; padding:12px 14px; background:rgba(252, 211, 77, 0.05); border-left:4px solid #fcd34d; border-radius:0 10px 10px 0;">' +
                           '<span style="color:#fcd34d; font-weight:800; font-size:11px; letter-spacing:1.5px; text-transform:uppercase;">👁️ VISUAL</span><br>' +
                           '<div style="color:#94a3b8; font-size:13.5px; font-style:italic; line-height:1.6; margin-top:6px;">' + p1.trim() + '</div>' +
                           '</div>';
                });

                content = content.replace(/\[?(?:Voiceover:|Audio:)\s*([\s\S]*?)\]?(?=(?:Visual:|<div|$))/gi, function(m, p1) {
                    return '<div style="margin-top:12px; margin-bottom:12px; padding:14px 16px; background:rgba(167, 139, 250, 0.15); border-left:4px solid #a78bfa; border-radius:0 10px 10px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.15);">' +
                           '<span style="color:#a78bfa; font-weight:800; font-size:11px; letter-spacing:1.5px; text-transform:uppercase;">🎙️ VOICEOVER</span><br>' +
                           '<div style="color:#ffffff; font-size:15px; font-weight:600; line-height:1.7; margin-top:8px;">"' + p1.trim() + '"</div>' +
                           '</div>';
                });

                if (title !== "") {
                    processedMainText += '<div class="script-block">' +
                                         '<span class="time-tag">⏱️ ' + title + '</span>' +
                                         '<div>' + content + '</div>' +
                                         '</div>';
                } else {
                    processedMainText += '<div style="margin-bottom: 15px;">' + content + '</div>';
                }
            });

            let escapeMainText = mainTextRaw.replace(/['"`\\]/g, '\\$&').replace(/\r?\n/g, '\\n');

            htmlOutput += '<div class="main-text-box">' + 
                            '<div style="white-space: pre-line;">' + processedMainText + '</div>' +
                            '<div class="copy-action-row">' +
                                '<button id="btn-copy-main" class="inline-copy-btn" onclick="directCopy(\'' + escapeMainText + '\', \'btn-copy-main\')">' + mainButtonLabel + '</button>' +
                            '</div>' +
                          '</div>';

            for (let i = 1; i < hashtagSplit.length; i += 2) {
                let platformHeader = hashtagSplit[i];
                let hashtagsRaw = hashtagSplit[i+1] || "";
                
                let cleanPlatformName = platformHeader.replace(/[\[\]]/g, '').replace(/ Hashtag/i, '');
                let btnId = "btn-copy-" + cleanPlatformName.toLowerCase();
                let escapeHashtags = hashtagsRaw.replace(/['"`\\]/g, '\\$&').replace(/\r?\n/g, '\\n');

                htmlOutput += '<div class="platform-box">' +
                                '<span class="platform-title">📱 ' + cleanPlatformName + '</span>' +
                                '<span class="hashtag-text">' + hashtagsRaw.trim() + '</span>' +
                                '<div class="copy-action-row">' +
                                    '<button id="' + btnId + '" class="inline-copy-btn" onclick="directCopy(\'' + escapeHashtags + '\', \'' + btnId + '\')">📋 Salin ' + cleanPlatformName + '</button>' +
                                '</div>' +
                              '</div>';
            }
            return htmlOutput;
        }

        let escapeFallback = text.replace(/['"`\\]/g, '\\$&').replace(/\r?\n/g, '\\n');
        let fallbackContent = text.replace(/(Ide Video:)/gi, '<span style="color:#38bdf8; font-weight:800;">💡 $1</span>');
        return '<div class="main-text-box" style="white-space: pre-line;">' + 
                    fallbackContent + 
                    '<div class="copy-action-row">' +
                        '<button id="btn-copy-fallback" class="inline-copy-btn" onclick="directCopy(\'' + escapeFallback + '\', \'btn-copy-fallback\')">📋 Salin Konten</button>' +
                    '</div>' +
               '</div>';
    }

    // FUNGSI BARU: Kompresi Gambar Otomatis di sisi Browser HP
    function compressImage(file, maxWidth = 800, quality = 0.7) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > height) {
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                    } else {
                        if (height > maxWidth) {
                            width = Math.round((width * maxWidth) / height);
                            height = maxWidth;
                        }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // Mengubah gambar menjadi base64 JPEG yang ringan
                    const dataUrl = canvas.toDataURL('image/jpeg', quality);
                    const base64String = dataUrl.split(',')[1];
                    resolve(base64String);
                };
                img.onerror = (error) => reject(error);
            };
            reader.onerror = (error) => reject(error);
        });
    }

    async function generate() {
        const btn = document.getElementById('btn');
        const res = document.getElementById('result');
        const product = document.getElementById('product').value;
        const tool = document.getElementById('toolType').value;
        const tone = document.getElementById('tone').value;
        const fileInput = document.getElementById('imageInput');

        if(!product && fileInput.files.length === 0) {
            return alert("Isi nama produk atau masukkan foto produk terlebih dahulu!");
        }

        btn.innerText = "⏳ Memproses...";
        btn.disabled = true;
        res.style.display = "block";

        let imageBase64 = "";
        
        try {
            if (fileInput.files.length > 0) {
                res.innerHTML = '<div style="text-align:center;color:#fcd34d;font-weight:600;padding:10px 0;">📸 Mengecilkan ukuran foto agar cepat...</div>';
                const file = fileInput.files[0];
                
                // MENGGUNAKAN FUNGSI KOMPRESI (Otomatis Max lebar 800px, Kualitas 70%)
                imageBase64 = await compressImage(file, 800, 0.7);
            }
            
            res.innerHTML = '<div style="text-align:center;color:#38bdf8;font-weight:600;padding:10px 0;">✨ Optikit AI sedang menyusun naskah viral...</div>';

            const response = await fetch('https://potikit-ai-backend.puteriamelia378.workers.dev/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ product, tool, tone, imageBase64 })
            });
            const data = await response.json();
            
            if (data.error) {
                res.innerHTML = `
                    <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; padding: 16px; border-radius: 14px; color: #fca5a5; font-size: 13px; line-height: 1.5;">
                        <strong style="color: #ef4444; font-size: 14px;">⚠️ Peringatan dari Server AI:</strong><br><br>
                        <span style="font-family: monospace; word-wrap: break-word;">${data.error}</span>
                    </div>`;
            } else if (data.caption) {
                res.innerHTML = formatScriptText(data.caption);
            } else {
                res.innerHTML = "<span style='color:#ef4444;font-weight:600;'>❌ Gagal mendapatkan hasil (Data Kosong).</span>";
            }
            
        } catch(e) {
            res.innerHTML = `
                <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; padding: 16px; border-radius: 14px; color: #fca5a5; font-size: 13px;">
                    <strong style="color: #ef4444;">❌ Gagal terhubung.</strong><br>
                    Detail: ${e.message}
                </div>`;
        }
        
        btn.innerText = "Generate Konten";
        btn.disabled = false;
    }
</script>
</body>
</html>
